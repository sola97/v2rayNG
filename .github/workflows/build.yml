name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

        retention-days: 7
    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

        retention-days: 7
    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

        retention-days: 7
    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

        retention-days: 7
  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Restore consolidated artifacts on job rerun
        id: restore_retained_artifacts
        if: ${{ github.run_attempt > 1 }}
        uses: actions/github-script@v9
        with:
          script: |
            const path = require('node:path');
            const os = require('node:os');
            async function restoreRetainedArtifacts({
              github,
              context,
              core,
              exec,
              owner = context.repo.owner,
              repo = context.repo.repo,
              desiredName = '',
              pattern = '',
              targetPath,
              mergeMultiple = false,
              explicitName = false,
              tempRoot = process.env.RUNNER_TEMP || os.tmpdir(),
              fs = require('node:fs'),
            }) {
              if (context.runAttempt <= 1) {
                core.setOutput('restored', 'false');
                return false;
              }
            
              const runArtifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: context.runId,
                per_page: 100,
              });
              const matches = (name) => {
                if (desiredName) return name === desiredName;
                if (pattern) {
                  const escaped = pattern.replace(/[.+^${}()|[\]\\]/g, '\\$&');
                  const expression = new RegExp(`^${escaped.replace(/\*/g, '.*').replace(/\?/g, '.')}$`);
                  return expression.test(name);
                }
                return true;
              };
              const currentArtifacts = runArtifacts.filter((artifact) => !artifact.expired && matches(artifact.name));
            
              const repositoryName = `${owner}/${repo}`;
              const repositoryArtifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner,
                repo,
                per_page: 100,
              });
              const candidates = [];
              for (const artifact of repositoryArtifacts) {
                const match = /^latest-run-(\d+)-(\d+)-(\d+)$/.exec(artifact.name);
                if (!match || Number(match[1]) !== Number(context.runId) || artifact.expired || !artifact.workflow_run?.id) continue;
                const retentionRun = (await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: artifact.workflow_run.id,
                })).data;
                if (retentionRun.status !== 'completed' ||
                    retentionRun.path !== '.github/workflows/artifact-retention.yml' ||
                    retentionRun.repository?.full_name !== repositoryName) continue;
                candidates.push({ artifact, sourceCreatedAt: Number(match[2]), sourceAttempt: Number(match[3]) });
              }
              candidates.sort((left, right) =>
                right.sourceCreatedAt - left.sourceCreatedAt ||
                right.sourceAttempt - left.sourceAttempt ||
                Date.parse(right.artifact.created_at) - Date.parse(left.artifact.created_at)
              );
              if (candidates.length === 0) {
                if (currentArtifacts.length > 0) {
                  core.info('No retained bundle is available; current-run artifacts remain available for the normal download step.');
                  core.setOutput('restored', 'false');
                  return false;
                }
                throw new Error(`No retained artifact bundle from .github/workflows/artifact-retention.yml matches source run ${context.runId}.`);
              }
            
              const bundle = candidates[0].artifact;
              const outerZip = path.join(tempRoot, `retained-${context.runId}.zip`);
              const outerDir = path.join(tempRoot, `retained-${context.runId}`);
              fs.mkdirSync(outerDir, { recursive: true });
              const archive = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: bundle.id,
                archive_format: 'zip',
              });
              fs.writeFileSync(outerZip, Buffer.from(archive.data));
              await exec.exec('unzip', ['-q', '-o', outerZip, '-d', outerDir]);
            
              const manifestPath = path.join(outerDir, 'manifest.json');
              if (!fs.existsSync(manifestPath)) throw new Error(`Retained bundle ${bundle.name} has no manifest.json.`);
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              if (Number(manifest.sourceRunId) !== Number(context.runId) || !Array.isArray(manifest.artifacts)) {
                throw new Error(`Retained bundle ${bundle.name} does not describe source run ${context.runId}.`);
              }
              const currentNames = new Set(currentArtifacts.map((artifact) => artifact.name));
              const selected = manifest.artifacts.filter((item) => item && typeof item.name === 'string' && matches(item.name) && !currentNames.has(item.name));
              if (selected.length === 0 && currentArtifacts.length === 0) {
                throw new Error(`Retained bundle ${bundle.name} contains no artifact matching ${desiredName || pattern || '*'} for run ${context.runId}.`);
              }
            
              const destination = path.resolve(targetPath);
              fs.mkdirSync(destination, { recursive: true });
              const extractArtifact = async (artifactName, archivePath) => {
                const artifactPath = mergeMultiple || explicitName ? destination : path.join(destination, artifactName);
                fs.mkdirSync(artifactPath, { recursive: true });
                await exec.exec('unzip', ['-q', '-o', archivePath, '-d', artifactPath]);
                core.info(`Restored artifact ${artifactName} to ${artifactPath}`);
              };
            
              // New artifacts replace the entire old artifact with that name, including removed files.
              for (const item of selected) {
                if (typeof item.filename !== 'string' || path.basename(item.filename) !== item.filename || !item.filename.endsWith('.zip')) {
                  throw new Error(`Retained bundle ${bundle.name} contains an invalid archive filename.`);
                }
                const innerZip = path.join(outerDir, item.filename);
                if (!fs.existsSync(innerZip)) throw new Error(`Retained bundle ${bundle.name} is missing ${item.filename}.`);
                await extractArtifact(item.name, innerZip);
              }
              for (const artifact of currentArtifacts) {
                const archivePath = path.join(outerDir, `current-${artifact.id}.zip`);
                const currentArchive = await github.rest.actions.downloadArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync(archivePath, Buffer.from(currentArchive.data));
                await extractArtifact(artifact.name, archivePath);
              }
            
              core.setOutput('restored', 'true');
              return true;
            }
            await restoreRetainedArtifacts({ github, context, core, exec, ...{"targetPath":"release","mergeMultiple":false} });
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        if: ${{ steps.restore_retained_artifacts.outputs.restored != 'true' }}
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/v2rayN-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
